name: Update News

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twscrape aiohttp

      - name: Fetch News
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_COOKIES_CLONE: ${{ secrets.X_COOKIES_CLONE }}
        run: |
          if [ -n "$X_COOKIES_CLONE" ]; then echo "$X_COOKIES_CLONE" > x_cookies_clone.txt; else echo "$X_COOKIES" > x_cookies_clone.txt; fi
          python fetch_news.py
          mkdir -p docs
          cp news.json docs/news.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json docs/news.json || true
          git diff --staged --quiet || git commit -m "Update news.json"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git push origin main
